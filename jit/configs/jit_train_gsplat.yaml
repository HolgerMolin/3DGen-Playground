# JiT `train_gsplat.py` hyperparameters — matches argparse defaults in jit/train_gsplat.py.
# Precedence: CLI > this file > argparse defaults.
#
# Required paths (obj_list, gs_path) are supplied by train_gsplat.sh + .env or on the CLI.
#
# Older train_gsplat.sh hard-coded (for reference): epochs 1000, batch_size 8, lr 5e-5,
# squaredcos_cap_v2, sh_degree0_only + predict_xstart, render weights 10.0, train_render_size 512,
# enable_render_loss_after 5000, gradient_accumulation_steps 4, num_workers 2, ckpt_every 5000,
# train_render_log_every 100, val_every 100, train_render_log_num_cam 1.

# --- Model ---
model: JiT-L/8  # 2026-06-03: scaled B/8 -> L/8 (depth 12->24, hidden 768->1024, heads 12->16; ~130M -> ~460M params). 2-GPU DDP overnight scaling run.
bottleneck: false
predict_xstart: true
noise_schedule: squaredcos_cap_v2
class_dropout_prob: 0.1

# --- Data (optional overrides; shell/env usually provides mean/std and paths) ---
# mean_file: null
# std_file: null
# Gaussian rank-transform tables for non-Gaussian channels (built by
# data/build_rank_transform.py). When set, listed channels are mapped to
# N(0,1) at load time and inverse-transformed before the renderer's
# sigmoid/exp activations. Default channels: opacity + 3 scale logits.
rank_transform_file: data/stats/rank_quantiles.pt
# Per-channel hard-clip thresholds (built by data/build_clip_thresholds.py),
# applied at load time BEFORE the rank transform. IMPORTANT: if a clipped channel
# is also in the rank set, the rank_transform_file MUST be one rebuilt on the
# clipped stream (build_rank_transform.py --clip_thresholds_file), otherwise the
# clipped point-mass maps to a single gauss value and the output is not N(0,1).
# clip_thresholds_file: data/stats/clip_thresholds_opacity_scales.pt
text_embed_path: object_classification/text_tokens
null_text_token_path: object_classification/null_text_token.npz
sphere2plane_path: data/sphere2plane.npy
sh_degree0_only: true
# Per-channel MSE weighting (14 DC channels): uniform — render schedule handles overall balance.

# Training Setup
epochs: 200  # 2026-05-26: 200-epoch render run resuming from pmean_curriculum ckpt 0022000.pt.
batch_size: 64  # 2026-06-03: PER-GPU micro-batch for the JiT-L/8 2-GPU DDP run. EFFECTIVE batch = batch_size(64) x grad_accum(4) x num_gpus(2) = 512 (held at 512 so all absolute-step schedules stay valid). 64/GPU keeps JiT-L (~2.7x B's activation/sample + ~5GB more optimizer state) ~40-45GB/GPU, safe unattended. Push to 128 only with gradient_checkpointing=true. Prev: 256 single-GPU (JiT-B, ~57GB).
ema_decay: 0.995

# Optimizer parameters
lr: 3e-4  # 2026-06-03: muP-ish width scaling for JiT-L. 4e-4 x (768/1024 base/width) = 3e-4 for the wider matmuls — more conservative for a from-scratch JiT-L overnight. (eff batch unchanged at 512, so this is a width move, not a batch move.)
betas: [0.9, 0.999]
text_proj_lr: 3e-4  # 2026-06-03: matched to base lr (muP-ish JiT-L scaling). NOTE: this run is class-conditioned (LabelEmbedder), so text_proj is largely inert; kept matched for consistency.
text_proj_betas: [0.9, 0.999]
lr_schedule: cosine
lr_warmup_steps: 200
lr_min: 1e-6
lr_cosine_total_steps: 0  # 2026-06-03: AUTO (= epochs * len(loader) // ga, computed after accelerate.prepare so it accounts for num_processes=2 + ga=4). Since eff batch stays 512, auto resolves to ~99,600 — same horizon — but auto removes the ga/GPU coupling footgun. Overnight won't reach it, so LR stays near 3e-4 peak all night (fine for fresh JiT-L).
# Optional engagement-warmup: list of [step, lr_scale] control points, linearly interpolated.
# Used to cushion the optimizer when a new loss component engages — small steps during the
# chaotic phase keep AdamW's moments from baking in bad directions. Values must be > 0.
# When active, OVERRIDES any lr_scale set via --overrides_yaml.
# lr_scale_schedule REMOVED 2026-05-30 (was [[22000, 0.2], [24000, 1.0]]). That was a render-at-22k
# engagement cushion for a RESUMED run. For this FROM-SCRATCH render-at-5k run it would clamp steps
# 0->22000 to 0.2x LR (see _p_mean_at_step: step <= first control point returns the first value),
# crippling the cold-start bootstrap and the entire render ramp, then snap to full LR AFTER render is
# fully engaged — backwards. lr_warmup_steps + the gradual render-weight ramp handle engagement; lr_scale
# stays 1.0 throughout (overrides.yaml).

# Diffusion parameters
P_mean: 0.0  # 2026-05-26: static neutral for the 200-epoch render run (terminated the 0.0->0.3 curriculum). Schedule disabled below.
P_std: 1.5
# Training timestep distribution: logitnormal (sigmoid(N(P_mean,P_std)), default) or
# uniform (t_value ~ U(0,1) — equal mass on every noise level; P_mean/P_std ignored).
timestep_dist: logitnormal
# P_mean_schedule DISABLED 2026-05-26: terminated the 0.0->0.3 curriculum; static P_mean=0.0 above governs.
# Previous schedule kept for reference:
#   - [0, 0.0]
#   - [14000, 0.0]
#   - [44000, 0.3]

# --- Reconstruction loss ---
# mse              : index-aligned per-Gaussian MSE (default; depends on atlas ordering).
# chamfer_feature  : pytorch3d.loss.chamfer_distance over all channels (permutation-invariant).
# chamfer_geometric: knn_points xyz-matching + MSE on matched channels (permutation-invariant).
# chamfer_patch    : bidirectional Chamfer WITHIN each chamfer_patch_size patch (pure-torch, no
#                    pytorch3d; per-patch permutation-invariant). Middle ground that bounds a
#                    splat's match to its patch + composes with permute_atlas=patch. ~63x cheaper.
# feature/geometric require pytorch3d; all Chamfer modes reuse channel_loss_weights.
recon_loss: sinkhorn_patch_hard
# Scalar weight on the Chamfer term (no-op for mse). Hot-reloadable via overrides.yaml.
# stock chamfer_feature is ~2*C larger than MSE (~28x for C=14 DC-only, ~118x for C=59).
# 0.03 validated for C=14: weighted loss ~0.6 at init (~half MSE scale).
# NOTE: chamfer_geometric (xyz-only matching) was tested 2026-05-22 and STALLS on this
# dense atlas (overfit floor ~0.49 vs feature's 0.042) regardless of weight — dense-cloud
# hard-NN local minima, not under-weighting. Don't switch to it without a k>1 soft-match fix.
chamfer_loss_weight: 0.07  # 2026-05-26: 1.0 -> 0.07 (= 1/C=14). Sinkhorn (hard or soft) sums over C=14 channels, making its clean-end param-grad exactly 14x MSE-equivalent at unit weight (measured: jit/diag_grad_magnitude.py @ step 14k EMA). 0.07 normalizes the clean-end recon grad to MSE-equivalent so render losses (LPIPS/L1/alpha) can actually compete at the clean end.
# Outer scalar on the recon return in total_loss (mse_loss * recon_loss_weight, then summed with
# render_l1 / alpha_l1 / lpips). 1.0 = recon-on (default). 0.0 = RENDER-ONLY: recon still computes
# (SinkColl/SinkResid/MSE keep logging) but contributes nothing to backward. Hot-reloadable.
# 2026-05-28: 1.0 (recon ON) for the FINAL sinkhorn+render run. Render-only (0.0) was REJECTED:
# both render-only runs collapsed to dark/formless samples — recon is the load-bearing anchor on
# atlas opacity/scale/color statistics. See memory project_render_only_broken.
recon_loss_weight: 1.0
# Cap the Chamfer kNN search at this many *query* points per direction (no-op for mse).
# Fresh uniform subset each step against the full target -> exact NN per query, unbiased
# mean estimate. 0 = all 16384 points; 4096 ~= 2.2x faster, 8192 ~= 1.4x. Below ~2048 the
# per-step plumbing (casts/copies) dominates, so gains flatten.
chamfer_subsample: 4096
# Patch side for recon_loss=chamfer_patch (loss matches WITHIN each chamfer_patch_size patch).
# 0 => model patch_size (8). Smaller => less within-patch permutation freedom => steeper
# loss-vs-t (P=1 == index-MSE). 4 chosen to force per-cell refinement that P=8 was too loose
# to (see CLAUDE.md). Independent of the model patch (still 8); chamfer_subsample N/A here.
# permute_atlas=patch auto-aligns its permute granularity to THIS value.
chamfer_patch_size: 8  # 2026-06-03: kept at 8 for the JiT-L scaling run (matches the JiT-B baseline patch — clean apples-to-apples; only the model size + LR change). 64-Gaussian patches, 64x64 sinkhorn cost matrices. permute_atlas=patch aligns to 8.
# Backward (GT-as-query) Chamfer weight (1.0 = symmetric). The backward term is coverage/recall:
# every GT Gaussian must have a nearby prediction. >1 upweights coverage to fight mode-collapse
# and force every Gaussian to be represented somewhere — a SET-level lever (no per-cell/ordering
# constraint), aligned with the set-fidelity objective. Hot-reloadable (overrides.yaml). Testing
# whether this alone restores a reasonable loss-vs-t t-delta (mse_hybrid disabled to not confound).
chamfer_rev_weight: 12.0
# Chamfer+MSE hybrid: lambda on an index-aligned MSE term added on top of the Chamfer loss.
# 2026-05-23: COLD-START BOOTSTRAP for from-scratch sinkhorn_patch. mse_hybrid_weight is the
# starting magnitude (W0); mse_hybrid_warmup_steps linearly decays it W0 -> 0 over N steps then
# holds 0. The index-MSE binds cell->target to break the symmetric mean-collapse trap that stalls
# sinkhorn from scratch, then fades out leaving pure assignment. Testing whether a short co-train
# sets the model up for sinkhorn better than 20k steps of pure-MSE pretraining.
mse_hybrid_weight: 1.0
mse_hybrid_warmup_steps: 200
mse_hybrid_lownoise_mult: 4.0  # 2026-05-25: UPWEIGHT index-MSE toward low noise — linear ramp w(t)=1+3*t_value (w=1 at t=0 baseline -> w=4 at t=1 clean). Effective clean weight = mse_hybrid_weight*4 = 12. Amplifies clean (vs the failed t**2 downweight which only suppressed elsewhere). 1.0 = uniform/off.
sinkhorn_epsilon: 0.05
sinkhorn_iters: 100  # 2026-05-25: 150->100 for throughput. For sinkhorn_patch_hard the argmax/hard-loss converges far faster than the soft plan; at 100/eps0.05 collision ~4.5% (vs 3.6% @150), still ~at the eps floor (~2%). Don't go below ~75. Watch SinkColl% (~4-5% healthy). Launch-time only (not hot-reloadable).
# Pseudo-Huber radius for the within-patch ground cost. 0 = off (squared-L2, bit-identical to before).
# >0 robustifies the cost: cost = 2*delta^2*(sqrt(1+r^2/delta^2)-1) on the pair radius r=||x-y|| —
# quadratic (= squared-L2) for inliers, linear (2*delta*r) beyond r~=delta, so a few large-residual
# pairs stop dominating the OT assignment AND the gradient. Inlier scale matches sq (chamfer_loss_weight
# stays calibrated); delta->inf recovers the squared cost. Launch-time only (set here or via
# --huber_delta; NOT hot-reloadable). Matched pairs sit at sq~=2.9 (r~=1.7), so delta~=1.5-3 keeps
# inliers quadratic and only dampens true outliers; start ~2.0. Watch SinkColl% (softer tail can nudge it up).
huber_delta: 2.0
# Atlas ordering augmentation (Chamfer-only): randomize the per-Gaussian ordering the
# model sees each step so multi-step sampling on its own (non-canonical) output is in-dist.
# patch = permute within each patch (kept for multi-step-sampling robustness); global = permute
# all 16384; none = off. For recon_loss=chamfer_patch the permute granularity auto-aligns to
# chamfer_patch_size (=4 here) so permutation stays within chamfer patches. ~sub-ms/step.
# 2026-05-23: PATCH for the cold-start bootstrap run — matches the documented cold-start-collapse
# condition (UPDATE3) and actually exercises sinkhorn's permutation-invariance (permute=none lets
# sinkhorn degenerate to MSE-like at clean t, which would trivially "succeed").
permute_atlas: patch

# --- Render loss ---
render_loss_weight: 8.0
alpha_mask_loss_weight: 4.0
lpips_loss_weight: 8.0  # 2026-05-26: 4.0->8.0 (doubled) to lean harder on the perceptual/coherence signal at the productive band.
lpips_net: vgg # TODO
# lpips | dinov2.
perceptual_backend: vgg
render_loss_num_cam: 2  # 2026-05-28: KEEP at 2 for the FINAL run (the perf win). Render cost ~ kept*num_cam; 4->2 ~halves render (est. ~+30% throughput, ~1.05->~1.4 sps). 2 cams preserves multi-view signal. See memory project_render_perf_budget.
train_render_size: 224
render_zoom_factor: 1.0  # 2026-05-26: zoom factor on the camera FOV (>1 = narrower FOV / object fills more of frame). At zoom=1 the gaussianverse objects fill ~20% of the rendered frame (bbox_fill measured via jit/measure_alpha_coverage.py), so ~80% of every render L1/LPIPS pixel is background diluting the loss-mean. Probe with --render_zoom_factor 1.6 or 2.0 before committing.
# Per-(sample, camera) zoom table from data/build_per_sample_render_fov.py — tighter per-
# object framing than the global render_zoom_factor can give without clipping. Composes
# multiplicatively with render_zoom_factor; leave commented to use only the global zoom.
per_sample_zoom_file: data/stats/per_sample_render_fov.pt  # 2026-05-26: enabled. Probe measured alpha_mean 0.154 -> 0.218 (1.45x signal density gain), clip_frac unchanged at 3.91%. Render-weight schedule below divided by 1.45 to keep gradient magnitudes ~constant; the change is in DIRECTION (cleaner LPIPS inputs, more pixels actually painting object).
ref_camera_tar: artifacts/ref_camera.tar.gz
enable_render_loss_after: 5000  # 2026-05-30: FROM-SCRATCH run — render fires from step 5000 (schedule below ramps weights 0 -> max over 5k->15k). NOTE: this also gates overrides.yaml (all keys apply at step>=5000); audited consistent with main config, no silent flip.
render_weight_schedule:
  # 2026-05-30: render ramp for the FROM-SCRATCH eff-512 run. 5000->15000 = 10k steps x eff512 =
  # 5.12M samples, sample-matched to the parent's render-engagement budget. COUPLED TO ga=2: if ga
  # is bumped to 4 (eff-1024) this silently becomes a 10.24M-sample ramp (render under-engaged) — keep
  # the endpoint in sync with ga. Columns: [step, render_l1, alpha_l1, lpips].
  - [5000, 0.0, 0.0, 0.0]
  - [15000, 5.5, 2.75, 5.5]
# Hard mask on FM t_value: render loss only applies when t_value >= cutoff
# (i.e. the clean fraction is >= cutoff). 0 disables the mask. Samples
# below the cutoff are SLICED OUT before the render+LPIPS path runs, so
# the cutoff doubles as a memory cap (lower cutoff → bigger render batch).
render_loss_noise_cutoff: 0.8  # 2026-05-28: 0.0 -> 0.8 for the FINAL run. Render fires only on the clean band (t>=0.8, ~22/128 samples); the sinkhorn recon covers the noisy band. Paired with num_cam=2 -> ~22*2=44 cam-renders/microbatch (vs render-only's 256) — the throughput win.
train_render_log_every: 0
train_render_log_num_cam: 4

# --- Training ---

mixed_precision: bf16
gradient_accumulation_steps: 4  # 2026-06-03: 64(per-gpu) x 4 x 2(GPUs) = EFFECTIVE batch 512 (unchanged). Because eff stays 512, opt-step count is identical to the old ga2 single-GPU run, so render-ramp (5k->15k) and the AUTO cosine horizon remain sample-matched. Only breaks if eff drifts off 512.
gradient_checkpointing: false
compile: true
# Diagnostic only: prints rolling per-phase step-time breakdown (data/h2d/fwd/
# bwd/opt) every 100 steps on rank 0. Adds explicit GPU syncs around each
# phase, so totals are higher than non-profile runs — read the *ratios*. Off
# for normal runs.
profile_step_times: false
max_grad_norm: 4.0  # 2026-05-26: 1.0 -> 4.0; with cw=0.07 the post-rebalance grad-norms were clipping every step at 1.0. Restart from ckpt 29000.
num_workers: 10
preload_to_cpu: false
lazy_cache_to_cpu: true
preload_max_samples: 0
preload_workers: 0
persistent_workers: true
prefetch_factor: 4
seed: 0

# --- Logging / checkpoints / validation ---
# Training uses JiT flow-matching noising (x_t = t*x_0 + (1-t)*eps, t=0 noise,
# t=1 clean) via flow_matching_training_losses; heun/euler are the consistent
# samplers. ddim/dpm/ddpm will produce garbage on FM checkpoints.
log_every: 50
grad_norm_log_every_n_prints: 10
ckpt_every: 1000
val_every: 1000
# Multi-step x0_renoise validation (permute_atlas=patch is on, so the model should tolerate
# its own non-canonical output fed back across steps). Set to 1 for one-shot if permute=none.
val_sampling_steps: 50
# heun (deterministic PF-ODE, 2nd order). MEASURED 2026-05-24 (jit/diag_small_objects.py +
# permutation_probe): deterministic samplers keep the atlas cell<->Gaussian map FROZEN across
# steps (exact-match ~100%, 0 displacement after the first high-noise steps), so heun/euler do
# NOT collapse — they render bigger + coherent (~40% of GT extent, no specks). x0_renoise instead
# reshuffles ~60 cells/step AND contracts to ~20% extent via fresh-noise re-injection. So the
# earlier "heun collapses under permutation" claim was wrong. Gate: {heun,euler,x0_renoise}.
val_sampler: heun
val_cfg_scale: 2.0
ddim_eta: 0.0
# Fixed-seed prompt grid: tile i uses cond_pool[i] (validation prompts encoded
# at startup) and initial noise seeded with (val_grid_seed + i). One fixed
# camera per tile so cross-step diffs reflect model changes only.
# Only supported for val_sampler in {heun, euler, x0_renoise}.
val_grid_enabled: true
val_grid_rows: 3
val_grid_cols: 3
val_grid_seed: 1234
val_grid_camera_idx: 0
# Optional JSON list of validation prompts. If unset, a 64-prompt default
# (simple/multi-attribute/compositional) is used.
# val_prompts_file: jit/configs/val_prompts.json
dpm_solver_order: 2
dpm_algorithm_type: "dpmsolver++"
dpm_solver_type: midpoint
dpm_timestep_spacing: trailing
dpm_use_karras_sigmas: false
results_dir: output/dit_results

# Weights & Biases (rank-0 only; --no-wandb to disable)
wandb: true
wandb_project: 3dgen-jit
# wandb_entity:        # team/user; falls back to WANDB_ENTITY env or default
# wandb_run_name:      # falls back to basename(results_dir)
wandb_mode: online     # online | offline | disabled
wandb_tags: ""         # comma-separated, e.g. "lr-sweep,jit-b"
# wandb_group:         # group runs in the wandb UI (e.g. sweep id)
wandb_log_images: true

# Hot-reload hyperparameters during training (optional):
# overrides_yaml: jit/configs/overrides.yaml
# overrides_every: 1000

# resume: output/jit_JiT-XL/8_results_gsplat/0020000.pt


                                                                                                                                                                                                                                            